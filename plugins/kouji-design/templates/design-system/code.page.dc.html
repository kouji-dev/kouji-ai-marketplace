<helmet>
<style>
body{margin:0}
pre.block{margin:0;padding:var(--sp-4);border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel-2);font:13px/1.6 var(--font-mono);color:var(--ink);overflow-x:auto}
kbd{display:inline-block;min-width:22px;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:var(--r-sm);background:var(--panel-2);font:12px/1.5 var(--font-mono);text-align:center;color:var(--ink)}
</style>

<main class="doc">
<header>
<a href="index.dc.html">← Design system</a>
<h1>Code</h1>
<p>Code, commands and keys use <code>--font-mono</code> on a <code>--panel-2</code> surface, so they read apart from prose.</p>
</header>
<h2>Inline</h2>
<div class="specimen"><p style="margin: 0">Run <code>npm test</code> before you push.</p></div>
<h2>Block</h2>
<pre class="block">K.provide('app', { cart: K.persisted('cart', []) });</pre>
<h2>Keys</h2>
<div class="specimen"><span>Search with <kbd>Ctrl</kbd> <kbd>K</kbd>, close with <kbd>Esc</kbd>.</span></div>
</main>
