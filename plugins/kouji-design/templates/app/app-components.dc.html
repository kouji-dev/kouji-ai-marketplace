<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App · Components</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../ds/starter/tokens.css">
<link rel="stylesheet" href="../ds/starter/components/bundle.css">
<script src="../ds/starter/components/bundle.js"></script>
<script src="shared/store.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--sp-3)}
.swatch{height:56px;border:1px solid var(--line);border-radius:var(--r-md)}
</style>
</helmet>
<ds-screens index="">
<section id="foundations" data-title="Foundations" class="page stack">
<h2 class="title">Foundations</h2>
<div class="swatches">
<div class="stack"><div class="swatch" style="background: var(--bg);"></div><code>bg</code></div>
<div class="stack"><div class="swatch" style="background: var(--panel);"></div><code>panel</code></div>
<div class="stack"><div class="swatch" style="background: var(--ink);"></div><code>ink</code></div>
<div class="stack"><div class="swatch" style="background: var(--accent);"></div><code>accent</code></div>
</div>
<p class="body">Body text in <code>body</code>.</p>
<p class="small">A caption in <code>small</code>.</p>
</section>
<section id="actions" data-title="Actions" class="page stack">
<h2 class="title">Actions</h2>
<div class="row">
<ds-button>Primary</ds-button>
<ds-button variant="ghost">Ghost</ds-button>
<ds-button disabled="">Disabled</ds-button>
</div>
</section>
<section id="account" data-title="Account" class="page stack">
<h2 class="title">Account</h2>
<ds-user-card></ds-user-card>
<ds-greeting></ds-greeting>
</section>
</ds-screens>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
