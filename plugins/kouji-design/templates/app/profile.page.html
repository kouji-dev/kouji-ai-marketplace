<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App · Profile</title>
  <link rel="stylesheet" href="shared/tokens.css">
  <link rel="stylesheet" href="shared/base.css">
  <script type="module" src="shared/components.js"></script>
</head>
<body>
  <main class="page stack">
    <a href="index.html">← Home</a>
    <h1>Profile</h1>
    <!-- Same store as the home page: a name changed there shows here, and back. -->
    <app-user-card></app-user-card>
    <p id="greeting"></p>
  </main>

  <script type="module">
    import { effect } from './shared/deps.js';
    import { user } from './shared/store.js';
    const greeting = document.getElementById('greeting');
    effect(() => { greeting.textContent = `Hello, ${user.value.name}.`; });
  </script>
</body>
</html>
