<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1350">
<title>A clip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@600&display=swap">
<link rel="stylesheet" href="tokens.css"><!-- ui/styles/tokens.css, graphite: copied in by render.mjs -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1350px; overflow: hidden; background: var(--well); }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--font-ui); }
  .view { position: absolute; left: 0; top: 0; width: 1920px; height: 1200px; overflow: hidden; }
  .take { display: block; width: 100%; height: 100%; transform-origin: 50% 50%; }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: var(--panel); border-top: 2px solid var(--hair); }
  .callout { position: absolute; left: 64px; right: 64px; bottom: 0; height: 150px; display: flex; align-items: center; gap: 22px;
    color: var(--ink); font-size: 46px; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; }
  .callout::before { content: ""; flex: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1350" data-fps="30">
<div class="band"></div>
<div id="w0" class="view clip" data-start="0" data-duration="6" data-track-index="0"><video id="s0" class="take clip" src="scene-1.mp4" muted playsinline data-start="0" data-duration="6" data-track-index="2"></video></div>
<div id="c0_0" class="callout clip" data-start="0.5" data-duration="3" data-track-index="1">Type &lt;this&gt;</div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.from("#c0_0", { opacity: 0, x: -16, duration: 0.35, ease: "power2.out" }, 0.5);
  tl.to("#s0", { scale: 1.2, x: 10, y: -20, duration: 0.7, ease: "power2.inOut" }, 2);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
